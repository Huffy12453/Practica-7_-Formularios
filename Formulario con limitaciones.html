<!DOCTYPE html>
<!-- Declaración del tipo de documento HTML5 -->
<html lang="es">
<head>
    <!-- Configuración para el soporte de caracteres especiales y acentos (UTF-8) -->
    <meta charset="UTF-8">
    <!-- Ajuste para adaptar la pantalla a dispositivos móviles (diseño responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Formularios en HTML</title>

    <!-- Enlace a la librería de íconos Font Awesome (se corrigió el salto de línea en la URL) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Encabezado principal del formulario -->
    <h2>Formulario con limitaciones</h2>

    <!-- Formulario principal para envío de datos -->
    <form action="" method="post">

        <!-- 
            CAMPO DESHABILITADO (disabled):
            Desactiva por completo la interacción. El usuario no puede hacer clic ni escribir.
            Diferencia clave: Los datos de un campo con 'disabled' NO se envían al servidor al procesar el formulario.
        -->
        Ingresa tu nombre:
        <input type="text" name="nombre" disabled><br>

        <!-- 
            LIMITACIÓN DE CARACTERES (maxlength):
            Restringe la cantidad máxima de caracteres que el usuario puede escribir (en este caso, máximo 5).
        -->
        Contraseña:
        <input type="password" name="pass" maxlength="5"><br>

        <!-- 
            CAMPO DE SOLO LECTURA (readonly):
            Muestra un texto predefinido que el usuario puede leer o copiar, pero NO editar ni borrar.
            Diferencia clave: A diferencia de 'disabled', la información de un campo 'readonly' SÍ se envía al servidor.
        -->
        Comentarios:
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>

    </form>

</body>
</html>
