<!DOCTYPE html>
<!-- Declaración del tipo de documento HTML5 -->
<html lang="es">
<head>
    <!-- Configuración de caracteres para soportar acentos y caracteres especiales (UTF-8) -->
    <meta charset="UTF-8">
    <!-- Configuración para diseño responsivo en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Formularios en HTML</title>

    <!-- Importación de la librería de íconos Font Awesome mediante CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Encabezado principal de la página -->
    <h2>Formularios con agrupamiento</h2>

    <!-- Formulario principal. 
         action: URL a la que se envían los datos (vacío = misma página).
         method: Método HTTP de envío ("post" para envío seguro de datos o archivos). -->
    <form action="" method="post">
        
        <!-- Primer grupo de campos: Datos Personales -->
        <fieldset>
            <!-- Título que identifica al grupo de campos -->
            <legend>Datos personales</legend>

            <!-- Campo para ingresar el nombre completo -->
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br>

            <!-- Campo para adjuntar o subir un archivo de documento -->
            Documento válido:
            <input type="file" name="documento"><br>

            <!-- Campo selector de fecha para nacimiento -->
            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
        </fieldset>

        <!-- Segundo grupo de campos: Datos Académicos/Estudio -->
        <fieldset>
            <!-- Título del segundo grupo -->
            <legend>Datos de estudio:</legend>

            <!-- Campo para ingresar el nombre de la institución -->
            Nombre de la escuela:
            <input type="text" name="escuela"><br>

            <!-- Campo para adjuntar certificado académico -->
            Certificado válido:
            <input type="file" name="certificado"><br>

            <!-- Campo selector de fecha para el egreso -->
            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>

        <br>

        <!-- Botón de envío del formulario con ícono de avión de papel -->
        <button type="submit">
            Enviar <i class="fa-regular fa-paper-plane"></i>
        </button>

        <!-- Botón para limpiar/restablecer todos los campos del formulario con ícono de papelera -->
        <button type="reset">
            Borrar <i class="fa fa-trash"></i>
        </button>
        
    </form>

</body>
</html>
